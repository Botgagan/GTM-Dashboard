version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gtm_postgres
    restart: always
    environment:
      POSTGRES_USER: gtm_user
      POSTGRES_PASSWORD: gtm_password
      POSTGRES_DB: gtm_db
    ports:
    
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - gtm_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gtm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hind.social
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - gtm_network

volumes:
  postgres_data:

networks:
  gtm_network:
    driver: bridge
